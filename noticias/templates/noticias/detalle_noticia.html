{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ noticia.titulo }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <a href="{% url 'home' %}" class="btn btn-secondary mb-3">Volver</a>

    <div class="card">
        <div class="card-body">
            <!-- Título centrado -->
            <h2 class="card-title text-center mb-4">{{ noticia.titulo }}</h2>

            <!-- Contenido del texto -->
            <p class="card-text">{{ noticia.contenido }}</p>

            <!-- Imagen en tamaño más pequeño y centrada -->
            {% if noticia.imagen %}
                <div class="text-center my-4">
                    <img src="{{ noticia.imagen.url }}" alt="{{ noticia.titulo }}" style="max-width: 60%; height: auto; border-radius: 8px;">
                </div>
            {% endif %}

            <!-- Fecha al final centrada y en estilo secundario -->
            <p class="text-muted text-center">Publicado el {{ noticia.fecha_publicacion }}</p>
        </div>
    </div>

</div>

</body>
</html>
