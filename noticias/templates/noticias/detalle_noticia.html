{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ noticia.titulo }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <a href="{% url 'home' %}" class="btn btn-secondary mb-3">Volver</a>
    <div class="card">
        {% if noticia.imagen %}
        <img src="{{ noticia.imagen.url }}" class="card-img-top" alt="{{ noticia.titulo }}">
        {% endif %}
        <div class="card-body">
            <h2 class="card-title">{{ noticia.titulo }}</h2>
            <p class="card-text">{{ noticia.contenido }}</p>
            <p class="text-muted">Publicado el {{ noticia.fecha_publicacion }}</p>
        </div>
    </div>
</div>

</body>
</html>
